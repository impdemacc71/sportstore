{% extends "store/base.html" %}

{% block content %}
<style>
    .auth-container {
        max-width: 500px;
        margin: 80px auto;
        padding: 40px;
        background-color: #ffffff;
        border: 1px solid #e5e5e5;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .auth-title {
        font-size: 22px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        color: #000000;
    }

    .auth-message {
        font-size: 14px;
        color: #666666;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .btn-auth {
        background-color: #000000;
        color: #ffffff;
        border: none;
        padding: 14px 28px;
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        min-height: 48px;
        line-height: 20px;
    }

    .btn-auth:hover {
        background-color: #333333;
        text-decoration: none;
        color: #ffffff;
    }

    @media (max-width: 576px) {
        .auth-container {
            margin: 25px 15px;
            padding: 30px 20px;
        }

        .auth-title {
            font-size: 20px;
        }

        .auth-message {
            font-size: 13px;
        }

        .btn-auth {
            width: 100%;
            text-align: center;
        }
    }

    @media (max-width: 400px) {
        .auth-container {
            margin: 20px 10px;
            padding: 25px 15px;
        }

        .auth-title {
            font-size: 18px;
        }
    }
</style>

<div class="container">
    <div class="auth-container">
        <h1 class="auth-title">Logged Out</h1>
        <p class="auth-message">You have been successfully logged out. Thank you for shopping with us!</p>
        <a href="{% url 'login' %}" class="btn-auth">Log In Again</a>
    </div>
</div>
{% endblock %}
